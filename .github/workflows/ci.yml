name: LocalTube CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Electron JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/player-preload.cjs
          node --check electron/player.js
          node --check electron/playback-progress.cjs

      - name: Run unit and contract tests
        run: npm test

      - name: Build renderer
        run: npm run build

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package no longer exists on current images.
          # Install only the platform packages required by compileSdk 36.
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalTube-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

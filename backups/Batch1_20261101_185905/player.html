
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      media-src 'self' file: blob:;
      frame-src https://www.youtube-nocookie.com;
      object-src 'none';
      base-uri 'none';
    "
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalTube Player</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a12;
      color: #f4f4f8;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid #25283a;
      background: #101321;
    }

    .brand {
      color: #a78bfa;
      font-weight: 800;
      letter-spacing: 1px;
      margin-right: 18px;
    }

    #title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #d9d9e5;
      font-size: 14px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #video, #youtube {
      display: none;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #292d40;
      border-radius: 12px;
      box-shadow: 0 20px 70px #0009;
    }

    #video {
      height: auto;
      max-height: calc(100vh - 110px);
    }

    #youtube {
      border: 0;
    }

    #status {
      color: #a7a9bd;
      text-align: center;
      max-width: 560px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">LOCALTUBE</span>
    <span id="title">Player</span>
  </header>

  <main>
    <video id="video" controls autoplay playsinline></video>
   <iframe
      id="youtube"
      title="LocalTube YouTube Player"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
></iframe>
    <div id="status">Loading video…</div>
  </main>

  <script src="./player.js"></script>
</body>
</html>

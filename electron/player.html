
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://www.youtube.com https://s.ytimg.com;
      style-src 'self' 'unsafe-inline';
      media-src 'self' file: blob:;
      frame-src https://www.youtube-nocookie.com https://www.youtube.com;
      object-src 'none';
      base-uri 'none';
    "
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalTube Player</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a12;
      color: #f4f4f8;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid #25283a;
      background: #101321;
    }

    .brand {
      color: #a78bfa;
      font-weight: 800;
      letter-spacing: 1px;
      margin-right: 18px;
    }

    #title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #d9d9e5;
      font-size: 14px;
    }

    main {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #video, #youtube {
      display: none;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid #292d40;
      border-radius: 12px;
      box-shadow: 0 20px 70px #0009;
    }

    #video {
      height: auto;
      max-height: calc(100vh - 110px);
    }

    #youtube {
      border: 0;
    }

    #status {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      color: #f4f4f8;
      text-align: center;
      max-width: min(560px, calc(100% - 48px));
      line-height: 1.6;
      padding: 12px 18px;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      background: #080a12d9;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">LOCALTUBE</span>
    <span id="title">Player</span>
  </header>

  <main>
    <video id="video" controls autoplay playsinline></video>
  <div id="youtube"></div>
    <div id="status">Loading videoâ€¦</div>
  </main>

  <script src="./player.js"></script>
</body>
</html>
